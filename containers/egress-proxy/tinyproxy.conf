# Egress allow-list proxy for Atelier agent containers (AUDIT.md §4.2).
#
# REAL INVARIANT (corrected 2026-09-22 after security + critic review;
# earlier comments here claimed something stronger that tinyproxy does not
# actually enforce -- do not restate the old claim):
#   - The hostname allow-list applies to every request tinyproxy handles,
#     both the CONNECT method (used for HTTPS) and plain forward-proxy
#     requests (GET/POST/etc against a http:// URL). A host absent from
#     the filter is refused with 403 either way.
#   - CONNECT is restricted to port 443 by ConnectPort below.
#   - Plain-HTTP forward-proxy requests are NOT restricted to any
#     particular port: tinyproxy has no per-method port policy, only
#     ConnectPort (which, per its own name and tinyproxy's source, applies
#     to CONNECT only). A request like `curl -x $HTTPS_PROXY
#     http://github.com:22/` reaches an allow-listed host on an arbitrary
#     TCP port. We looked for a tinyproxy directive to close this
#     (ReverseOnly + ReversePath) and confirmed empirically that it also
#     breaks CONNECT entirely (every CONNECT gets "Bad request, no mapping
#     found"), which is not an acceptable trade -- tinyproxy genuinely has
#     no directive that restricts forward-proxy methods/ports while
#     leaving CONNECT alone. This is a real, currently-accepted gap: it
#     does not widen *which* hosts are reachable (the allow-list still
#     gates it), only *how* an allow-listed host may be reached. See
#     README.md for the same statement.

Port 3128
Listen 0.0.0.0
Timeout 30
MaxClients 100

# Client access: this proxy sits on the atelier-internal Podman network
# and must be reachable from agent containers on that network, not just
# localhost (tinyproxy's own default is "Allow 127.0.0.1" only).
#
# Narrowed to the atelier-internal subnet specifically (not all of
# RFC1918): the proxy also has an interface on the default `podman`
# bridge (10.88.0.0/16) so it can reach the internet, and an RFC1918-wide
# Allow let every container on that bridge -- or on any other bridge on
# this host -- use the proxy too. Verified: a container on an unrelated
# network could reach api.github.com through this proxy under the old
# rule. Containers on the default bridge already have unrestricted
# internet access directly, so this was not a live escalation, but it
# scoped the control to more than Atelier.
#
# 10.89.14.0/24 MUST match the `egress_subnet` variable in ../../Justfile
# (`podman network create --internal --subnet <egress_subnet>
# atelier-internal`) -- the two are not read from a shared source, so a
# change to one requires the matching change here. `just egress-up`
# detects a subnet mismatch between this network and the variable and
# recreates the network, but it cannot detect a mismatch against this
# file; keep them in sync by hand.
Allow 10.89.14.0/24
Allow 127.0.0.1
Allow ::1

# CONNECT (the HTTPS path) is only ever allowed to port 443. This does
# NOT restrict plain-HTTP forward-proxy requests -- see the invariant
# note above.
ConnectPort 443

# Filter file is (re)generated at container start by entrypoint.sh from
# /etc/tinyproxy/allowlist.d/*.txt; each hostname is anchored (^host\$)
# so an allow-listed name like "github.com" cannot match
# "github.com.attacker.example" via a substring match. Verified
# empirically with FilterType ere: exact match allowed, substring/suffix
# match refused (HTTP 403), and a host absent from the list entirely
# refused. /run/tinyproxy is a tmpfs (see Justfile egress-up), writable by
# the tinyproxy user, on an otherwise --read-only container filesystem.
FilterType ere
FilterDefaultDeny Yes
FilterURLs No
Filter "/run/tinyproxy/filter"

# No TLS interception happens here (CONNECT tunnels raw bytes), so this
# only affects tinyproxy's own proxy-added headers. Disabled so nothing
# reveals proxy internals to either side.
DisableViaHeader Yes
# XTinyproxy header defaults to off (not set here) -- same reasoning.

# No LogFile/Syslog directive means tinyproxy logs to stdout, which
# `podman logs atelier-egress` shows directly. LogLevel Info surfaces both
# successful CONNECTs and "Proxying refused on filtered domain" refusals
# -- verified empirically to be the level where both appear.
LogLevel Info

# User/Group are deliberately NOT set here: the container already runs
# as the non-root `tinyproxy` user (see Containerfile), and tinyproxy's
# post-bind setuid/setgid call is a no-op (and logs a warning) once the
# process isn't root to begin with.
